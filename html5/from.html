<section>
    <h2>Jannatul Er Badam</h2>
    <form >
        <fieldset class="personal-info">
            <legend>Personal Info</legend>
             <label for="name">Your name</label>
       <input type="text" name="" id="name">
       

       <label for="email">Your email </label>
       <input type="email" name="" id="email">
       <label for="phone">Phone</label>
       <input type="number" name="" id="phone">
        </fieldset>
       

       
       <fieldset>
        <legend>Badam Info</legend>
        <input type="radio" name="nut" id="chinabadam">
        <label for="chinabadam">Deshi nut</label>

        <input type="radio" name="nut" id="indian">
        <label for="indian">Indian nut</label>

        <input type="radio" name="nut" id="thi">
        <label for="thi">Thi nut</label>




       </fieldset>
       <fieldset>
        <legend>Vorta selection</legend>
        <input type="checkbox" name="vorta" id="deshivorta">
        <label for="deshivorta">Deshivorta</label>
        <input type="checkbox" name="vorta" id="indianvorta">
        <label for="indianvorta">Indianvorta</label>
        <input type="checkbox" name="vorta" id="thivorta">
        <label for="thivorta">Thivorta</label>
        
       </fieldset>
       <fieldset>
        <legend>Extra Info</legend>
        <textarea cols="50" rows="5" name="" id=""></textarea>

       </fieldset>
       <input type="submit" value="Submit">
       <input type="reset" value="Clear">
    </form>
</section>
