version: "3.9"

services:
  # ── PostgreSQL 16 Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: codearena-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codearena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codearena_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-codearena}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codearena}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 In-Memory Cache & BullMQ Queue ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: codearena-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── CodeArena Backend API & Submission Workers ──────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: codearena-server
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-codearena}:${POSTGRES_PASSWORD:-codearena_secure_pass}@postgres:5432/${POSTGRES_DB:-codearena}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-codearena_jwt_access_secret_production_key_32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-codearena_jwt_refresh_secret_production_key_32chars}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      DOCKER_JUDGE_IMAGE: amust-codearena/judge-runner:latest
    volumes:
      # Expose host docker daemon so server can spawn isolated sandbox runner containers
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── CodeArena Frontend Client (Production Nginx) ────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: codearena-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - server

  # ── Sandbox Runner Image Builder ────────────────────────────────────────────
  judge-runner:
    build:
      context: ./docker
      dockerfile: judge-runner.Dockerfile
    image: amust-codearena/judge-runner:latest
    container_name: codearena-judge-runner-build
    entrypoint: ["echo", "AMUST CodeArena Judge Runner image built successfully."]

volumes:
  pgdata:
  redisdata:
