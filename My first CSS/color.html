<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explor Bacic CSS</title>
    <style>
        #Embedded{
            font-size: larger;
            font-weight: bolder;
        }
        #H3{
            text-align: center;
        }
        p{
           background-color: rgba(218, 79, 148, 0.527);
           width: 50%;
        }
        li{
            color: tomato;
        }
        .H2{
            text-align: center;
        }
    </style>
      
</head>
<body>
    <h3 style="color: blueviolet;" id="H3">Learning Basic CSS</h3>
    <h4 class="H2" style="background-color: rgb(188, 165, 209);">Inline CSS</h4>
    <p>CSS meaning:Cascading Style Sheet</p>
    <p>Style is colorful</p>
    <p>Short from is CSS</p>
    <p>Needs style Rule and value separated by color(:)</p> 
    <p>after each style you need to use semi-colon(;)</p>
    <ul class="H2" >
        <li>Inline CSS</li>
        <li id="Embedded">Internal CSS</li>
        <li>External CSS</li>
    </ul>
</body>
</html>
