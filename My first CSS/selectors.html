<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixed Selectors</title>
    
    <style>
        
        
        
        
        p{color: rgba(163, 152, 144, 0.973);}

        #st{
            background-color: rgb(98, 85, 105)
            ;
            width: 50%;
            
        }
        .nd, .css{
            font-size: 30px;
        }
        .css{
            font-weight: 700;
        }
        input[type="text"]{
            color: red;
            
        }


    </style>
</head>
<body>
    <h3>Explor Mixed Selectors</h3>
    <p id="st">My first line CSS</p>
    <p class="nd css">My second line CSS</p>
    <p class="css">My third line CSS</p>
    <p>My fourth line CSS</p>
    <p>My fifth line CSS</p>
    <p>My sixth line CSS</p>
    <p>My seventh line CSS</p>
<form>
        <input type="text">
    <input type="password">
</form>
    

    
    
</body>
</html>
