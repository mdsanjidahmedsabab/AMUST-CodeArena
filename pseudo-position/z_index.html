<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index</title>
    <style>
        .box{
            position: relative;
        }
        .boy{
            z-index: 10;
        }
        .ring{
            top: -60px;
            z-index: 3;
            left: 7px;
        }
        .water{
            top: -150px;
        }

    </style>
</head>
<body>
    <h3>Z-Index</h3>
    <div class="swim-container">
        <div class="box boy">
            <img src="pseudo-position-ph/swim/boy.svg" alt=""></div>
        <div class="box ring">
            <img src="pseudo-position-ph/swim/ring.svg" alt=""></div>
        <div class="box water">
            <img src="pseudo-position-ph/swim/water.svg" alt=""></div>
    </div>
</body>
</html>
