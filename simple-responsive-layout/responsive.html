<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResPonSive WeBsitE</title>
    <style>
        body{
            border: 1px solid blue;
            max-width: 1140px;
            margin: 0 auto;
        }
        .img-container{
            display: flex;
        }
        .img-container div{
            width: 50%;
        }
        .img-container img{
            width: 100%;
        }
        @media screen and (max-width:576px) {
            .img-container{
                flex-direction: column-reverse;
            }
            .img-container div{
                width: 100%;
            }
            
        }
    </style>
</head>
<body>
    <header>
        <h1>Responsive Website</h1>
        <ol>
        <li>Viewport meta tag</li>
        <li>CSS Relative Unit</li>
        <li>Body maxx width and holizontal center align</li>
        <li>imge fluid</li>
        <li>Two column flex and use media query with flex direction column</li>
        <li>multi column: grid layout</li>
        <li>Menu responsive:will need javascript</li>
        </ol>
    </header>
    <main>
        <div class="img-container">
            <div><img src="images/puri.jpg" alt="">
            </div>
            <div><img src="mutton-liver.jpg" alt="">
            </div>
        </div>
        
        
    </main>
</body>
</html>
